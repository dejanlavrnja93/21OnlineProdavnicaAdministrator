<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikli</title>
</head>
<body>
  <header>
    <h1>Artikli</h1>
  </header>

  <main>
    <section aria-label="Lista artikala">
      <table>
        <thead>
          <tr>
            <th scope="col">Br</th>
            <th scope="col">Naziv</th>
            <th scope="col">Cena($)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section aria-label="Detalji artikla">
      <div>
        <p>Naziv: <span id="detaljiNaziv"></span></p>
        <p>Cena: <span id="detaljiCena"></span></p>
        <p>Opis: <span id="detaljiOpis"></span></p>
      </div>
    </section>

    <section aria-label="Dodavanje novog artikla">
      <form>
        <label for="naziv">Naziv:</label>
        <input type="text" id="naziv" name="naziv">

        <label for="cena">Cena:</label>
        <input type="number" id="cena" name="cena" min="0" step="0.01">

        <label for="opis">Opis:</label>
        <textarea id="opis" name="opis"></textarea>

        <button type="submit">Dodaj</button>
      </form>
    </section>
  </main>
  <script src="java.js"></script>
</body>
</html>
